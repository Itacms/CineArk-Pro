name: Gerar APK CineArk

on:
  push:
    branches: [ "main" ] # Mude para "master" se a sua branch principal tiver esse nome

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Instalar Cordova
      run: npm install -g cordova

    - name: Criar Projeto Cordova e Compilar
      run: |
        cordova create app com.cineark.iptv CineArk
        cd app
        cordova platform add android
        rm -rf www/*
        cp -r ../index.html www/
        cordova build android --no-telemetry

    - name: Upload do APK Gerado
      uses: actions/upload-artifact@v4
      with:
        name: CineArk-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
